<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Activated Insights · Sales Floor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f0e8;font-family:system-ui,-apple-system,sans-serif;margin:0;overflow:hidden}
#wrap{background:#f5f0e8;color:#291e3b;height:100vh;display:flex;flex-direction:column}
.topbar{background:#291e3b;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #f0b429;flex-shrink:0}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{height:36px;width:auto;display:block}
.brand-name{font-size:15px;font-weight:700;color:#fff;letter-spacing:0.01em}
.brand-divider{width:1px;height:22px;background:#4a3a5c}
.sales-label{font-size:12px;color:#a89bc0;letter-spacing:0.1em;text-transform:uppercase}
.slide-counter{font-size:12px;color:#a89bc0;background:#3d2d55;padding:4px 12px;border-radius:20px}
.updated{font-size:10px;color:#4a3a5c;margin-left:4px}
.ndots{display:flex;gap:5px;align-items:center;flex-wrap:wrap;max-width:400px;justify-content:flex-end}
.ndot{width:7px;height:7px;border-radius:50%;background:#4a3a5c;cursor:pointer;transition:background 0.2s}
.ndot.on{background:#f0b429}
.progress-bar{height:3px;background:#e8e0d4;flex-shrink:0}
.progress-fill{height:3px;background:#f0b429;transition:width 0.1s linear}
.content{flex:1;overflow:hidden;position:relative}
.slide{display:none;padding:22px 28px;flex-direction:column;gap:14px;height:100%;position:absolute;top:0;left:0;right:0;bottom:0}
.slide.on{display:flex}
.tags{display:flex;gap:8px;margin-bottom:2px}
.tag{font-size:13px;font-weight:700;padding:5px 15px;border-radius:20px;text-transform:uppercase;letter-spacing:0.07em}
.tag-ae{background:#291e3b;color:#fff}
.tag-bdr{background:#e8e0d4;color:#291e3b}
.tag-mtd{background:#f0b429;color:#291e3b}
.tag-sl{background:#6b3fa0;color:#fff}
.tag-hbc{background:#291e3b;color:#f0b429}
.tag-team{background:#f0b429;color:#291e3b}
.tag-new{background:#22c55e;color:#fff}
.headline{font-size:28px;font-weight:700;color:#291e3b;line-height:1.2}
.subline{font-size:12px;color:#9a8fa8;margin-top:3px}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:4px}
.pcard{background:#fff;border-radius:12px;border:1.5px solid #e8e0d4;padding:20px 16px;text-align:center;box-shadow:0 1px 4px rgba(41,30,59,0.07);display:flex;flex-direction:column;align-items:center}
.pcard.p1{border-color:#f0b429;background:#fffbf0;box-shadow:0 3px 12px rgba(240,180,41,0.18)}
.medal{font-size:11px;font-weight:700;padding:3px 12px;border-radius:20px;display:inline-block;margin-bottom:12px}
.m1{background:#f0b429;color:#291e3b}.m2{background:#e8e0d4;color:#291e3b}.m3{background:#ede8f5;color:#6b3fa0}
.av{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;margin:0 auto 10px;border:2px solid #e8e0d4}
.av-sl{background:#ede8f5;color:#6b3fa0}.av-hbc{background:#291e3b;color:#f0b429}.av-ent{background:#f0ebe0;color:#291e3b}
.av-bdr-sl{background:#ede8f5;color:#6b3fa0}.av-bdr-hbc{background:#291e3b;color:#f0b429}.av-bdr-ent{background:#f0ebe0;color:#291e3b}
.pname{font-size:16px;font-weight:600;color:#291e3b;margin-bottom:2px}
.pteam{font-size:10px;color:#9a8fa8;margin-bottom:12px}
.pval{font-size:30px;font-weight:700;color:#291e3b;line-height:1}
.punit{font-size:11px;color:#9a8fa8;margin-top:4px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.tcard{background:#fff;border-radius:12px;border:1.5px solid #e8e0d4;padding:14px 18px;box-shadow:0 1px 4px rgba(41,30,59,0.07)}
.tcard.lead{border-color:#f0b429;background:#fffbf0}
.thead{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #e8e0d4}
.tdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.tmgr{font-size:14px;font-weight:600;color:#291e3b}.tsub{font-size:9px;color:#9a8fa8}
.tbadge{margin-left:auto;font-size:9px;padding:2px 8px;border-radius:20px;background:#f0b429;color:#291e3b;font-weight:700}
.tstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}
.tstat-l{font-size:8px;color:#9a8fa8;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:2px}
.tstat-v{font-size:16px;font-weight:700;color:#291e3b}
.treps{border-top:1px solid #e8e0d4;padding-top:8px}
.trep{display:flex;justify-content:space-between;padding:3px 0}
.trep-n{font-size:11px;color:#9a8fa8}.trep-v{font-size:11px;font-weight:600;color:#291e3b}
.team-deals-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px}
.team-deals-card{background:#fff;border-radius:12px;border:1.5px solid #e8e0d4;padding:14px 18px;box-shadow:0 1px 4px rgba(41,30,59,0.07)}
.td-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:8px;border-bottom:1.5px solid #e8e0d4}
.td-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.td-mgr{font-size:15px;font-weight:700;color:#291e3b}.td-sub{font-size:10px;color:#9a8fa8}
.td-total{font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px;background:#f0b429;color:#291e3b;margin-left:auto;white-space:nowrap}
.td-col-hdr{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:0 0 5px;border-bottom:1px solid #e8e0d4;margin-bottom:3px}
.td-col-lbl{font-size:9px;color:#9a8fa8;text-transform:uppercase;letter-spacing:0.07em;font-weight:600}
.td-col-lbl.right{text-align:right}
.td-rep-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #f5f0e8}
.td-rep-row:last-child{border-bottom:none}
.td-rep-name{font-size:13px;color:#291e3b;font-weight:500}
.td-rep-val{font-size:13px;font-weight:700;color:#291e3b;text-align:right;min-width:60px}
.td-rep-units{font-size:12px;color:#9a8fa8;text-align:right;min-width:32px}
.welcome-grid{display:flex;flex-direction:column;gap:14px;margin-top:4px}.welcome-row{display:flex;gap:16px;justify-content:center}.welcome-row.row1 .welcome-card{flex:0 0 calc(33.333% - 12px);max-width:calc(33.333% - 12px)}.welcome-row.row2 .welcome-card{flex:0 0 calc(25% - 12px);max-width:calc(25% - 12px)}
.welcome-card{background:#fff;border-radius:14px;border:1.5px solid #e8e0d4;padding:20px 14px;text-align:center;box-shadow:0 1px 4px rgba(41,30,59,0.07);display:flex;flex-direction:column;align-items:center}
.welcome-photo{width:90px;height:90px;border-radius:50%;object-fit:cover;object-position:center top;border:3px solid #f0b429;margin:0 auto 12px;display:block}
.welcome-name{font-size:14px;font-weight:700;color:#291e3b;margin-bottom:4px}
.welcome-role{font-size:11px;color:#9a8fa8;line-height:1.4}
.welcome-team{display:inline-block;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:8px}
.wt-sl{background:#ede8f5;color:#6b3fa0}
.wt-hbc{background:#291e3b;color:#f0b429}
.wt-lead{background:#f0b429;color:#291e3b}
.wt-enable{background:#dcfce7;color:#166534}
.botbar{padding:10px 28px;display:flex;align-items:center;gap:10px;background:#291e3b;border-top:2px solid #3d2d55;flex-shrink:0}
.btn{font-size:12px;color:#a89bc0;background:#3d2d55;border:1px solid #4a3a5c;border-radius:8px;padding:6px 14px;cursor:pointer}
.btn:hover{color:#fff;background:#4a3a5c}
.btn.hi{color:#291e3b;background:#f0b429;border-color:#f0b429;font-weight:600}
</style>
</head>

function ini(n){return n.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase()}
function avc(t){if(t==='sl')return'av-sl';if(t==='hbc')return'av-hbc';if(t==='ent')return'av-ent';if(t==='bdr-sl')return'av-bdr-sl';if(t==='bdr-hbc')return'av-bdr-hbc';return'av-bdr-ent'}
function fn(v){return Math.round(v||0).toLocaleString()}
function fa(v){return(!v||v===0)?'—':'$'+Math.round(v).toLocaleString()}
function top3(arr,key,filter){
  const seen={};arr.forEach(r=>{if(!seen[r.name]||(r[key]||0)>(seen[r.name][key]||0))seen[r.name]=r});
  let d=Object.values(seen);if(filter)d=d.filter(r=>r.team===filter);
  return d.filter(r=>(r[key]||0)>0).sort((a,b)=>(b[key]||0)-(a[key]||0)).slice(0,3);
}
function podHTML(reps,vFn,unit){
  if(!reps.length)return'<p style="color:#9a8fa8;font-size:14px;padding:20px 0">No data yet — early in the month!</p>';
  return'<div class="podium">'+['1st','2nd','3rd'].slice(0,reps.length).map((pl,i)=>`
    <div class="pcard${i===0?' p1':''}">
      <span class="medal m${i+1}">${pl}</span>
      <div class="av ${avc(reps[i].team)}">${ini(reps[i].name)}</div>
      <div class="pname">${reps[i].name}</div>
      <div class="pteam">${TL[reps[i].team]||reps[i].team}</div>
      <div class="pval">${vFn(reps[i])}</div>
      ${unit?`<div class="punit">${unit}</div>`:''}
    </div>`).join('')+'</div>';
}
function welcomeHTML(){
  const row1=NEWBIES.slice(0,3);const row2=NEWBIES.slice(3);
  function card(p){return`<div class="welcome-card"><img class="welcome-photo" src="${p.photo}" alt="${p.name}"><div class="welcome-name">${p.name}</div><div class="welcome-role">${p.role}</div><span class="welcome-team ${p.tclass}">${p.team}</span></div>`;}
  return`<div class="welcome-grid"><div class="welcome-row row1">${row1.map(card).join('')}</div><div class="welcome-row row2">${row2.map(card).join('')}</div></div>`;
}
function teamDealsHTML(){
  const order=['Caleb','Darin','Deana','Walpole'];
  return'<div class="team-deals-grid">'+order.map(key=>{
    const m=MGRS[key];
    const aeMap={};AE.forEach(r=>{if(m.reps.includes(r.name)&&(!aeMap[r.name]||(r.acv||0)>(aeMap[r.name].acv||0)))aeMap[r.name]=r});
    const reps=Object.values(aeMap).sort((a,b)=>(b.acv||0)-(a.acv||0)).slice(0,5);
    const total=Object.values(aeMap).reduce((s,r)=>s+(r.acv||0),0);
    return`<div class="team-deals-card">
      <div class="td-header"><div class="td-dot" style="background:${m.color}"></div><div><div class="td-mgr">${m.label}</div><div class="td-sub">${m.sub}</div></div><span class="td-total">${total>0?fa(total):'—'}</span></div>
      <div class="td-col-hdr"><span class="td-col-lbl">Rep</span><span class="td-col-lbl right">ACV</span><span class="td-col-lbl right">Units</span></div>
      ${reps.map(r=>`<div class="td-rep-row"><span class="td-rep-name">${r.name}</span><span class="td-rep-val">${(r.acv||0)>0?fa(r.acv):'—'}</span><span class="td-rep-units">${r.units||0}</span></div>`).join('')}
    </div>`;
  }).join('')+'</div>';
}
function teamHTML(){
  const aeMap={};AE.forEach(r=>{if(!aeMap[r.name]||(r.acv||0)>(aeMap[r.name].acv||0))aeMap[r.name]=r});
  const stats=Object.values(MGRS).map(m=>{
    const reps=m.reps.map(n=>aeMap[n]||{name:n,calls:0,msched:0,acv:0});
    return{...m,calls:reps.reduce((s,r)=>s+(r.calls||0),0),msched:reps.reduce((s,r)=>s+(r.msched||0),0),acv:reps.reduce((s,r)=>s+(r.acv||0),0),reps};
  }).sort((a,b)=>b.acv-a.acv);
  return'<div class="tgrid">'+stats.map((m,i)=>`
    <div class="tcard${i===0?' lead':''}">
      <div class="thead"><div class="tdot" style="background:${m.color}"></div><div><div class="tmgr">${m.label}</div><div class="tsub">${m.sub}</div></div>${i===0?'<span class="tbadge">leading</span>':''}</div>
      <div class="tstats"><div><div class="tstat-l">ACV MTD</div><div class="tstat-v" style="font-size:13px">${m.acv>0?fa(m.acv):'—'}</div></div><div><div class="tstat-l">Calls</div><div class="tstat-v">${fn(m.calls)}</div></div><div><div class="tstat-l">Meetings</div><div class="tstat-v">${fn(m.msched)}</div></div></div>
      <div class="treps">${[...m.reps].sort((a,b)=>(b.acv||0)-(a.acv||0)).slice(0,4).map(r=>`<div class="trep"><span class="trep-n">${r.name}</span><span class="trep-v">${(r.acv||0)>0?fa(r.acv):'—'}</span></div>`).join('')}</div>
    </div>`).join('')+'</div>';
}

  {tags:['tag-hbc','tag-mtd'],t:['Home-Based Care','Month to Date'],h:'Top Home-Based Care AEs',sub:'Closed ACV this month',fn:()=>podHTML(top3(AE,'acv','hbc'),r=>fa(r.acv),'')},
  {type:'team'},
  {type:'team-deals'},
  {tags:['tag-bdr','tag-mtd'],t:['BDR','Month to Date'],h:'Top caller',sub:'BDRs · outbound calls MTD',fn:()=>podHTML(top3(BDR,'calls'),r=>fn(r.calls),'calls')},
  {tags:['tag-bdr','tag-mtd'],t:['BDR','Month to Date'],h:'Top meeting booked',sub:'BDRs · meetings scheduled MTD',fn:()=>podHTML(top3(BDR,'msched'),r=>fn(r.msched),'meetings')},
  {tags:['tag-bdr','tag-mtd'],t:['BDR','Month to Date'],h:'Top SALs',sub:'BDRs · sales accepted leads MTD',fn:()=>podHTML(top3(BDR,'sals'),r=>fn(r.sals),'SALs')},
  {tags:['tag-bdr','tag-mtd'],t:['BDR','Month to Date'],h:'Top deals sourced',sub:'BDRs · sourced closed ACV MTD',fn:()=>podHTML(top3(BDR,'sourced'),r=>fa(r.sourced),'')},
];
function slideHTML(s){
  if(s.type==='welcome')return`<div class="tags"><span class="tag tag-new">🎉 New Team Members</span></div><div class="headline">Welcome to the team!</div><div class="subline">Please give a warm Activated Insights welcome to our newest additions</div>${welcomeHTML()}`;
  if(s.type==='team')return`<div class="tags"><span class="tag tag-team">Team Totals</span><span class="tag tag-mtd">Month to Date</span></div><div class="headline">Team performance</div><div class="subline">All AE teams · closed ACV + activity this month</div>${teamHTML()}`;
  if(s.type==='team-deals')return`<div class="tags"><span class="tag tag-team">Team Deals</span><span class="tag tag-mtd">Month to Date</span></div><div class="headline">Top closed ACV by team</div><div class="subline">Top 5 reps per team · ACV + units closed</div>${teamDealsHTML()}`;
  return`<div class="tags">${s.tags.map((t,i)=>`<span class="tag ${t}">${s.t[i]}</span>`).join('')}</div><div class="headline">${s.h}</div><div class="subline">${s.sub}</div>${s.fn()}`;
}
let cur=0,paused=false,pval=0,ptick;const DUR=7000;
function render(){
  document.getElementById('content').innerHTML=SLIDES.map((s,i)=>`<div class="slide${i===0?' on':''}" id="s${i}">${slideHTML(s)}</div>`).join('');
  document.getElementById('ndots').innerHTML=SLIDES.map((_,i)=>`<div class="ndot${i===cur?' on':''}" onclick="go(${i})"></div>`).join('');
  document.getElementById('counter').textContent=`${cur+1} / ${SLIDES.length}`;
}
function show(i){document.querySelectorAll('.slide').forEach((el,j)=>el.classList.toggle('on',j===i));document.querySelectorAll('.ndot').forEach((el,j)=>el.classList.toggle('on',j===i));document.getElementById('counter').textContent=`${i+1} / ${SLIDES.length}`;}
function go(i){cur=i;show(i);pval=0;document.getElementById('pfill').style.width='0%'}
function next(){cur=(cur+1)%SLIDES.length;show(cur);pval=0;document.getElementById('pfill').style.width='0%'}
function prev(){cur=(cur-1+SLIDES.length)%SLIDES.length;show(cur);pval=0;document.getElementById('pfill').style.width='0%'}
function tick(){clearInterval(ptick);if(paused)return;ptick=setInterval(()=>{pval+=100;document.getElementById('pfill').style.width=Math.min(pval/DUR*100,100)+'%';if(pval>=DUR){pval=0;next()}},100);}
function togglePause(){paused=!paused;const b=document.getElementById('pbtn');b.textContent=paused?'resume':'pause';b.classList.toggle('hi',!paused);paused?clearInterval(ptick):tick();}
render();tick();
</script>
